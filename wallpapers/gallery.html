<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Billions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}

/* Title */
h1{
text-align:center;
font-size:50px;
margin-top:40px;
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
}

p{
text-align:center;
color:#aaa;
margin-bottom:30px;
opacity:0;
animation:fadeUp 1s ease forwards;
animation-delay:0.3s;
}

/* Gallery Grid */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px 40px;
}

/* Image box */
.img-box{
overflow:hidden;
border-radius:20px;
transform:scale(0.8) translateY(60px);
opacity:0;
transition:all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
cursor:pointer;
}

/* Image */
.img-box img{
width:100%;
height:100%;
object-fit:cover;
transition:0.6s;
}

/* Hover (Apple feel) */
.img-box:hover img{
transform:scale(1.1);
}

/* Active reveal */
.img-box.show{
transform:scale(1) translateY(0);
opacity:1;
}

/* Keyframes */
@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<h1><i>Gallery</i></h1>
<p>Billions Series Wallpapers</p>

<div class="gallery">

<div class="img-box"><a href="1.jpg" target="_blank"><img src="1.jpg"></a></div>
<div class="img-box"><a href="2.jpg" target="_blank"><img src="2.jpg"></a></div>
<div class="img-box"><a href="3.jpg" target="_blank"><img src="3.jpg"></a></div>
<div class="img-box"><a href="4.jpg" target="_blank"><img src="4.jpg"></a></div>
<div class="img-box"><a href="5.jpg" target="_blank"><img src="5.jpg"></a></div>
<div class="img-box"><a href="6.jpg" target="_blank"><img src="6.jpg"></a></div>
<div class="img-box"><a href="7.jpg" target="_blank"><img src="7.jpg"></a></div>
<div class="img-box"><a href="8.jpg" target="_blank"><img src="8.jpg"></a></div>
<div class="img-box"><a href="9.jpg" target="_blank"><img src="9.jpg"></a></div>

</div>

<script>

/* Apple-style stagger animation */
const boxes = document.querySelectorAll('.img-box');

function reveal() {
  boxes.forEach((box, index) => {
    const top = box.getBoundingClientRect().top;

    if (top < window.innerHeight - 100) {
      setTimeout(() => {
        box.classList.add('show');
      }, index * 120);
    }
  });
}

window.addEventListener('scroll', reveal);
window.addEventListener('load', reveal);

</script>

</body>
</html>
